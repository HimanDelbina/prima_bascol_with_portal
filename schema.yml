components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - override_weight
      - override_loss
      - cancel
      - status_change
      - restore
      - print
      type: string
      description: |-
        * `create` - ثبت جدید
        * `update` - ویرایش اطلاعات
        * `delete` - حذف رکورد
        * `override_weight` - تغییر دستی اوزان
        * `override_loss` - تغییر دستی افت
        * `cancel` - ابطال سند
        * `status_change` - تغییر وضعیت
        * `restore` - بازیابی اطلاعات
        * `print` - چاپ قبض
    AdminSystemSetting:
      type: object
      description: Full system settings for super admins / system admins.
      properties:
        id:
          type: integer
          readOnly: true
        company_name:
          type: string
          title: نام شرکت
          maxLength: 200
        company_logo:
          type: string
          format: uri
          nullable: true
          title: لوگوی شرکت
        company_address:
          type: string
          title: آدرس شرکت
        company_phone:
          type: string
          title: تلفن
          maxLength: 50
        company_email:
          title: ایمیل
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        receipt_header_title:
          type: string
          title: عنوان بالای قبض
          maxLength: 200
        serial_start_number:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: شماره سریال شروع
        serial_prefix:
          type: string
          title: پیشوند شماره سریال (اختیاری)
          maxLength: 20
        weight_unit:
          type: string
          title: واحد وزن
          maxLength: 20
        decimal_places:
          type: integer
          maximum: 32767
          minimum: 0
          title: تعداد ارقام اعشار وزن
        max_tolerance_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: حداکثر درصد مجاز انحراف (%)
        max_tolerance_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: حداکثر کیلوگرم مجاز انحراف (Kg)
        require_waybill:
          type: boolean
          title: شماره بارنامه اجباری باشد
        require_driver:
          type: boolean
          title: اطلاعات راننده اجباری باشد
        require_origin:
          type: boolean
          title: مبدأ بار اجباری باشد
        require_destination:
          type: boolean
          title: مقصد بار اجباری باشد
        require_unload_location:
          type: boolean
          title: جایگاه تخلیه اجباری باشد
        default_print_template:
          allOf:
          - $ref: '#/components/schemas/DefaultPrintTemplateEnum'
          title: قالب پیش‌فرض چاپ
        receipt_footer_note:
          type: string
          title: متن پاورقی قبض
        items_per_page:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: تعداد رکورد در هر صفحه
      required:
      - id
    AlertIgnoreRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
      required:
      - reason
    AlertResolveRequest:
      type: object
      properties:
        resolution_note:
          type: string
          minLength: 3
      required:
      - resolution_note
    AlertReviewRequest:
      type: object
      properties:
        note:
          type: string
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
          title: کاربر اقدام‌کننده
        username:
          type: string
