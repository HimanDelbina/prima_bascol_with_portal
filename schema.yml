        name: alert_type
        schema:
          type: string
          title: نوع هشدار
          enum:
          - LONG_WAITING_TIME
          - LOSS_ANOMALY
          - NET_WEIGHT_ANOMALY
          - VEHICLE_TARE_ANOMALY
          - WEIGHT_DISCREPANCY
          - WEIGHT_EDIT_ANOMALY
        description: |-
          * `VEHICLE_TARE_ANOMALY` - وزن خالی غیرعادی خودرو
          * `WEIGHT_DISCREPANCY` - مغایرت وزن ارسالی و باسکول
          * `LOSS_ANOMALY` - افت غیرعادی محموله
          * `NET_WEIGHT_ANOMALY` - وزن خالص غیرعادی
          * `LONG_WAITING_TIME` - زمان توقف غیرعادی
          * `WEIGHT_EDIT_ANOMALY` - اصلاح غیرعادی وزن
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - in: query
        name: driver
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - in: query
        name: party
        schema:
          type: number
      - in: query
        name: plate
        schema:
          type: string
      - in: query
        name: product
        schema:
          type: number
      - in: query
        name: risk_score_max
        schema:
          type: number
      - in: query
        name: risk_score_min
        schema:
          type: number
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          title: سطح اهمیت
          enum:
          - CRITICAL
          - HIGH
          - INFO
          - LOW
          - MEDIUM
        description: |-
          * `INFO` - اطلاعات (Info)
          * `LOW` - کم (Low)
          * `MEDIUM` - متوسط (Medium)
          * `HIGH` - بالا (High)
          * `CRITICAL` - بحرانی (Critical)
      - in: query
        name: status
        schema:
          type: string
          title: وضعیت هشدار
          enum:
          - IGNORED
          - OPEN
          - RESOLVED
          - REVIEWED
        description: |-
          * `OPEN` - باز (Open)
          * `REVIEWED` - بررسی‌شده (Reviewed)
          * `RESOLVED` - حل‌شده (Resolved)
          * `IGNORED` - نادیده‌گرفته‌شده (Ignored)
      - in: query
        name: ticket
        schema:
          type: number
      - in: query
        name: vehicle
        schema:
          type: number
