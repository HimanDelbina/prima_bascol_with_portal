        first_weight_date_jalali:
          type: string
          readOnly: true
        second_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: وزن دوم (Kg)
        second_weight_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          title: تاریخ وزن دوم
        second_weight_date_jalali:
          type: string
          readOnly: true
        gross_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: وزن پر (Kg)
        tare_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: وزن خالی (Kg)
        net_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: وزن خالص (Kg)
        sent_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: وزن ارسالی / مبدا (Kg)
        weight_difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: اختلاف با وزن ارسالی (Kg)
        loss_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: وزن افت (Kg)
        final_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: وزن نهایی پس از کسر افت (Kg)
        is_tolerance_exceeded:
          type: boolean
          readOnly: true
          title: مغایرت بیش از حد مجاز
        open_alerts_count:
          type: integer
          readOnly: true
          default: 0
        risk_score:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ ایجاد
        created_at_jalali:
          type: string
          readOnly: true
      required:
      - created_at
      - created_at_jalali
      - driver_name
      - final_weight
      - first_weight
      - first_weight_date
      - first_weight_date_jalali
      - gross_weight
      - id
      - is_tolerance_exceeded
      - license_plate_display
      - loss_weight
      - net_weight
      - open_alerts_count
      - operation_type
      - operation_type_name
      - party
      - party_name
      - product
      - product_name
      - risk_score
      - second_weight
      - second_weight_date
      - second_weight_date_jalali
      - sent_weight
      - serial_number
      - status
      - tare_weight
      - weight_difference
      - weight_mode
    WeightModeEnum:
      enum:
      - empty_first
      - full_first
      - direct
      type: string
      description: |-
        * `empty_first` - ابتدا خالی (توزین اول) سپس پر (توزین دوم)
        * `full_first` - ابتدا پر (توزین اول) سپس خالی (توزین دوم)
        * `direct` - ثبت مستقیم هر دو وزن همزمان
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
