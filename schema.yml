openapi: 3.0.3
info:
  title: سامانه جامع و پیشرفته باسکول صنعتی (Prima Bascol API)
  version: 1.0.0
  description: REST API کامل، امن و Production-Ready جهت مدیریت عملیات باسکول، پایش
    هوشمند، گزارشات و هوش تجاری.
paths:
  /api/v1/admin/settings/:
    get:
      operationId: v1_admin_settings_retrieve
      description: دریافت کلیه پارامترها و آستانه‌های سامانه.
      summary: تنظیمات مدیریتی سامانه (ادمین)
      tags:
      - System Settings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSystemSetting'
          description: ''
    patch:
      operationId: v1_admin_settings_partial_update
      description: ویرایش آستانه‌های انحراف، پیشوند سریال و الزامات فرم‌ها.
      summary: ویرایش تنظیمات مدیریتی (ادمین)
      tags:
      - System Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminSystemSettingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminSystemSettingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminSystemSettingRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSystemSetting'
          description: ''
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      description: مشاهده گزارشات ممیزی و ردیابی تغییرات حساس سیستم (فقط‌خواندنی -
        بدون امکان ویرایش یا حذف).
      summary: لیست گزارشات ممیزی (Audit Log)
      parameters:
      - in: query
        name: action
        schema:
          type: string
          title: نوع عملیات
          enum:
          - cancel
          - create
          - delete
          - override_loss
          - override_weight
          - print
          - restore
          - status_change
          - update
        description: |-
          * `create` - ثبت جدید
          * `update` - ویرایش اطلاعات
          * `delete` - حذف رکورد
          * `override_weight` - تغییر دستی اوزان
          * `override_loss` - تغییر دستی افت
          * `cancel` - ابطال سند
          * `status_change` - تغییر وضعیت
          * `restore` - بازیابی اطلاعات
          * `print` - چاپ قبض
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - in: query
        name: model_name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - in: query
        name: record_id
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: number
      tags:
      - Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/{id}/:
    get:
      operationId: v1_audit_retrieve
      description: مشاهده گزارشات ممیزی و ردیابی تغییرات حساس سیستم (فقط‌خواندنی -
        بدون امکان ویرایش یا حذف).
      summary: مشاهده لاگ ممیزی و تغییرات
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این ثبت تغییرات (Audit Log) را شناسایی میکند.
        required: true
      tags:
      - Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: ابطال Refresh Token و قرار دادن آن در لیست سیاه جهت جلوگیری از
        استفاده مجدد.
      summary: خروج از سامانه (Logout)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
                  description: توکن رفرش جاری
              required:
              - refresh
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: خروج با موفقیت انجام شد.
        '400':
          description: توکن نامعتبر است.
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: دریافت اطلاعات پروفایل، نقش، شماره پرسنلی و لیست مجوزهای مجاز کاربر
        فعلی.
      summary: مشخصات کاربر جاری (/me)
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: ورود به سامانه با نام کاربری و رمز عبور و دریافت Access Token و
        Refresh Token به همراه مشخصات و دسترسی‌های کاربر.
      summary: دریافت توکن JWT (لاگین)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: ارسال refresh token جهت دریافت access token جدید بدون نیاز به ورود
        مجدد.
      summary: تمدید Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: v1_auth_token_verify_create
      description: بررسی صحت و عدم انقضای توکن ارسالی.
      summary: اعتبارسنجی توکن
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/verify-password/:
    post:
      operationId: v1_auth_verify_password_create
      description: بررسی رمز عبور فعلی کاربر بدون ایجاد توکن جدید جهت تایید هویت مجدد.
      summary: اعتبارسنجی رمز عبور جهت عملیات حساس
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: رمز عبور کاربر
              required:
              - password
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: 'نتیجه بررسی رمز عبور (valid: true/false)'
  /api/v1/dashboard/summary/:
    get:
      operationId: v1_dashboard_summary_retrieve
      description: محاسبه درون‌دیتابیسی تجمیعی تناژ، تعداد توزین، خودروهای در انتظار
        و هشدارهای پایش امروز.
      summary: خلاصه آمار لحظه‌ای امروز
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: ''
  /api/v1/dashboard/trends/:
    get:
      operationId: v1_dashboard_trends_retrieve
      description: دیتاست‌های استاندارد سری زمانی جهت رندر نمودارهای خطی، میله‌ای
        و دایره‌ای در فرانت‌اند، موبایل و Power BI.
      summary: روندهای آماری و چارت‌ها
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTrend'
          description: ''
  /api/v1/drivers/:
    get:
      operationId: v1_drivers_list
      summary: لیست رانندگان
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      tags:
      - Master Data
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDriverList'
          description: ''
    post:
      operationId: v1_drivers_create
      summary: ثبت راننده جدید
      tags:
      - Master Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriverRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
  /api/v1/drivers/{id}/:
    get:
      operationId: v1_drivers_retrieve
      summary: مشاهده راننده
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این راننده را شناسایی میکند.
        required: true
      tags:
      - Master Data
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
    put:
      operationId: v1_drivers_update
      summary: ویرایش راننده
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این راننده را شناسایی میکند.
        required: true
      tags:
      - Master Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriverRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
    patch:
      operationId: v1_drivers_partial_update
      summary: ویرایش جزیی راننده
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این راننده را شناسایی میکند.
        required: true
      tags:
      - Master Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDriverRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDriverRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDriverRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
    delete:
      operationId: v1_drivers_destroy
      summary: حذف راننده
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این راننده را شناسایی میکند.
        required: true
      tags:
      - Master Data
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: تست اتصال به پایگاه داده و در دسترس بودن سرور بدون افشای اطلاعات
        حساس.
      summary: بررسی سلامت سرویس (Health Check)
      tags:
      - System Settings
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
  /api/v1/locations/:
    get:
      operationId: v1_locations_list
      summary: لیست مبادی و مقاصد
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: location_type
        schema:
          type: string
          title: نوع محل
          enum:
          - both
          - destination
          - origin
        description: |-
          * `origin` - مبدأ
          * `destination` - مقصد
          * `both` - مبدأ و مقصد
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      tags:
      - Master Data
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationList'
          description: ''
    post:
      operationId: v1_locations_create
      summary: ثبت محل جدید
      tags:
      - Master Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
  /api/v1/locations/{id}/:
    get:
      operationId: v1_locations_retrieve
      summary: مشاهده محل
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این محل (مبدأ / مقصد) را شناسایی میکند.
        required: true
      tags:
      - Master Data
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
    put:
      operationId: v1_locations_update
      summary: ویرایش محل
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این محل (مبدأ / مقصد) را شناسایی میکند.
        required: true
      tags:
      - Master Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
    patch:
      operationId: v1_locations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این محل (مبدأ / مقصد) را شناسایی میکند.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLocationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLocationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLocationRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
    delete:
      operationId: v1_locations_destroy
      summary: حذف محل
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این محل (مبدأ / مقصد) را شناسایی میکند.
        required: true
      tags:
      - Master Data
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/loss-types/:
    get:
      operationId: v1_loss_types_list
      summary: لیست انواع افت کالا
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      tags:
      - Master Data
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLossTypeList'
          description: ''
    post:
      operationId: v1_loss_types_create
      summary: ثبت نوع افت جدید
      tags:
      - Master Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LossTypeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LossTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LossTypeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LossType'
          description: ''
  /api/v1/loss-types/{id}/:
    get:
      operationId: v1_loss_types_retrieve
      summary: مشاهده نوع افت
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این نوع افت را شناسایی میکند.
        required: true
      tags:
      - Master Data
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LossType'
          description: ''
