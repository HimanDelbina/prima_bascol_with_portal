<div class="iran-plate-container">
    <div class="iran-plate-blue-band">
        <div class="flag-icon"></div>
        <div>I.R.</div>
        <div>IRAN</div>
    </div>
    <input type="text" id="plate_part1" name="plate_part1" class="iran-plate-input-part1" maxlength="2" placeholder="12" value="{{ initial_part1|default:'' }}" autofocus>
    
    <select id="plate_letter" name="plate_letter" class="iran-plate-letter-select" title="انتخاب حرف پلاک">
        {% if iran_plate_letters %}
            {% for code, label in iran_plate_letters %}
                {% if code %}
                <option value="{{ code }}" {% if initial_letter == code or not initial_letter and code == 'ع' %}selected{% endif %}>{{ label }}</option>
                {% endif %}
            {% endfor %}
        {% else %}
            <option value="ع" {% if initial_letter == 'ع' or not initial_letter %}selected{% endif %}>ع</option>
            <option value="الف" {% if initial_letter == 'الف' %}selected{% endif %}>الف</option>
            <option value="ب" {% if initial_letter == 'ب' %}selected{% endif %}>ب</option>
            <option value="پ" {% if initial_letter == 'پ' %}selected{% endif %}>پ</option>
            <option value="ت" {% if initial_letter == 'ت' %}selected{% endif %}>ت</option>
            <option value="ث" {% if initial_letter == 'ث' %}selected{% endif %}>ث</option>
            <option value="ج" {% if initial_letter == 'ج' %}selected{% endif %}>ج</option>
            <option value="چ" {% if initial_letter == 'چ' %}selected{% endif %}>چ</option>
            <option value="ح" {% if initial_letter == 'ح' %}selected{% endif %}>ح</option>
            <option value="خ" {% if initial_letter == 'خ' %}selected{% endif %}>خ</option>
            <option value="د" {% if initial_letter == 'د' %}selected{% endif %}>د</option>
            <option value="ذ" {% if initial_letter == 'ذ' %}selected{% endif %}>ذ</option>
            <option value="ر" {% if initial_letter == 'ر' %}selected{% endif %}>ر</option>
            <option value="ز" {% if initial_letter == 'ز' %}selected{% endif %}>ز</option>
            <option value="ژ" {% if initial_letter == 'ژ' %}selected{% endif %}>ژ</option>
            <option value="س" {% if initial_letter == 'س' %}selected{% endif %}>س</option>
            <option value="ش" {% if initial_letter == 'ش' %}selected{% endif %}>ش</option>
            <option value="ص" {% if initial_letter == 'ص' %}selected{% endif %}>ص</option>
            <option value="ض" {% if initial_letter == 'ض' %}selected{% endif %}>ض</option>
            <option value="ط" {% if initial_letter == 'ط' %}selected{% endif %}>ط</option>
            <option value="ظ" {% if initial_letter == 'ظ' %}selected{% endif %}>ظ</option>
            <option value="غ" {% if initial_letter == 'غ' %}selected{% endif %}>غ</option>
            <option value="ف" {% if initial_letter == 'ف' %}selected{% endif %}>ف</option>
            <option value="ق" {% if initial_letter == 'ق' %}selected{% endif %}>ق</option>
            <option value="ک" {% if initial_letter == 'ک' %}selected{% endif %}>ک</option>
            <option value="گ" {% if initial_letter == 'گ' %}selected{% endif %}>گ</option>
            <option value="ل" {% if initial_letter == 'ل' %}selected{% endif %}>ل</option>
            <option value="م" {% if initial_letter == 'م' %}selected{% endif %}>م</option>
            <option value="ن" {% if initial_letter == 'ن' %}selected{% endif %}>ن</option>
            <option value="و" {% if initial_letter == 'و' %}selected{% endif %}>و</option>
            <option value="ه" {% if initial_letter == 'ه' %}selected{% endif %}>ه</option>
            <option value="ی" {% if initial_letter == 'ی' %}selected{% endif %}>ی</option>
            <option value="آ" {% if initial_letter == 'آ' %}selected{% endif %}>آ</option>
            <option value="D" {% if initial_letter == 'D' %}selected{% endif %}>D</option>
            <option value="S" {% if initial_letter == 'S' %}selected{% endif %}>S</option>
        {% endif %}
    </select>

    <input type="text" id="plate_part2" name="plate_part2" class="iran-plate-input-part2" maxlength="3" placeholder="345" value="{{ initial_part2|default:'' }}">
    
    <div class="iran-plate-iran-code">
        <span>ایـران</span>
        <input type="text" id="plate_iran" name="plate_iran" maxlength="2" placeholder="64" value="{{ initial_iran|default:'' }}">
    </div>
</div>
{% if not hide_hidden_input %}
<input type="hidden" id="license_plate_display" name="license_plate_display" value="{{ initial_plate_display|default:'' }}">
{% endif %}
