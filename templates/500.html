<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطای داخلی سرور (۵۰۰) | سامانه جامع باسکول پریما</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #212529;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9ecef;
            max-width: 550px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
        }
        .error-code {
            display: inline-block;
            font-size: 2.5rem;
            font-weight: 800;
            color: #dc3545;
            background-color: #fdf2f2;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container p-3 d-flex justify-content-center">
        <div class="error-card">
            <div class="error-code">
                <i class="bi bi-shield-slash-fill me-2"></i>۵۰۰
            </div>
            <h3 class="fw-bold mb-3">خطای داخلی سرور</h3>
            <p class="text-muted mb-4 fs-6">
                متأسفانه در پردازش درخواست شما مشکلی در سرور رخ داده است. این رخداد در سیستم مانیتورینگ ثبت شده و تیم فنی در حال بررسی آن هستند.
            </p>
            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                <a href="/" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-arrow-clockwise me-1"></i> صفحه اصلی سامانه
                </a>
                <a href="javascript:location.reload()" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-arrow-repeat me-1"></i> تلاش مجدد
                </a>
            </div>
        </div>
    </div>
</body>
</html>
