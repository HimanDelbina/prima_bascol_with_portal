{% extends 'base.html' %}
{% block title %}پروفایل کاربری{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
                <h5 class="fw-bold mb-0 text-primary"><i class="bi bi-person-badge me-2"></i>پروفایل و مشخصات کاربری</h5>
                <span class="badge bg-primary-subtle text-primary px-3 py-2 fs-6">{{ profile.get_role_display }}</span>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">نام کاربری</label>
                            <input type="text" class="form-control" value="{{ user.username }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">نقش سیستمی</label>
                            <input type="text" class="form-control" value="{{ profile.get_role_display }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">نام</label>
                            <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">نام خانوادگی</label>
                            <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">شماره موبایل</label>
                            <input type="text" name="mobile" class="form-control" value="{{ profile.mobile }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">ایمیل</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email }}">
                        </div>
                        <div class="col-md-12">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label fw-bold mb-0">تغییر رمز عبور (اختیاری)</label>
                                <a href="{% url 'accounts:password_change' %}" class="small text-primary text-decoration-none fw-bold">
                                    <i class="bi bi-shield-lock me-1"></i> صفحه اختصاصی تغییر رمز عبور
                                </a>
                            </div>
                            <input type="password" name="password" class="form-control" placeholder="برای عدم تغییر رمز عبور، این فیلد را خالی بگذارید">
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-top text-end">
                        <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> ذخیره تغییرات
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
