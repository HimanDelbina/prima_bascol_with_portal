{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
                <h5 class="fw-bold mb-0 text-primary"><i class="bi bi-percent me-2"></i>{{ title }}</h5>
                <a href="{% url 'masterdata:loss_type_list' %}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-right me-1"></i> بازگشت
                </a>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-bold">نام نوع افت <span class="text-danger">*</span></label>
                            {{ form.name }}
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">کد</label>
                            {{ form.code }}
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">درصد افت پیش‌فرض (%)</label>
                            {{ form.default_percent }}
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">توضیحات</label>
                            {{ form.description }}
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch mt-2">
                                {{ form.is_active }}
                                <label class="form-check-label fw-bold" for="id_is_active">فعال باشد</label>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-top text-end">
                        <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> ذخیره نوع افت
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
