{% extends "base.html" %}

{% block title %}صفحه مورد نظر یافت نشد (خطای ۴۰۴){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                <div class="mb-4">
                    <span class="badge bg-warning-subtle text-warning fs-1 px-4 py-2 rounded-pill">
                        <i class="bi bi-exclamation-triangle-fill"></i> ۴۰۴
                    </span>
                </div>
                <h2 class="fw-bold mb-3">صفحه مورد نظر یافت نشد</h2>
                <p class="text-muted mb-4 fs-6">
                    آدرس درخواستی شما ممکن است تغییر کرده، حذف شده باشد یا دسترسی به آن نیازمند مجوز دیگری باشد.
                </p>
                <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                    <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-speedometer2 me-1"></i> بازگشت به داشبورد
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">
                        <i class="bi bi-arrow-right me-1"></i> بازگشت به صفحه قبل
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
